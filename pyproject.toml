[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "www-search"
version = "1.0.0"
description = "Perplexica-like AI Search Engine - 基于多源搜索和 LLM 的智能问答系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "requests==2.33.0",
    "readability-lxml==0.8.4.1",
    "lxml_html_clean==0.4.5",
    "ddgs==9.14.4",
    "pyyaml==6.0.3",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "beautifulsoup4==4.14.3",
    "soupsieve==2.8.3",
    "itsdangerous==2.2.0",
    "slowapi==0.1.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15",
    "pytest>=9.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/LiuChen/www_search"

[tool.hatch.build.targets.wheel]
packages = ["agent", "fetcher", "llm", "search", "routes", "ui", "config"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E402", "E722"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"