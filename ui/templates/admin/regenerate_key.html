<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重设 API Key - AI Search Engine 管理面板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: #141414;
            border-bottom: 1px solid #2a2a2a;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #4f8ff7, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header a {
            color: #4f8ff7;
            text-decoration: none;
            font-size: 14px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 48px 24px;
        }
        .section {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 32px;
        }
        .section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #fff;
        }
        .key-display {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            color: #fbbf24;
        }
        .warning {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #4f8ff7;
            color: #fff;
        }
        .btn-primary:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ AI Search Engine 管理面板</h1>
        <a href="/admin">← 返回仪表盘</a>
    </div>

    <div class="container">
        <div class="section">
            <h2>🔄 API Key 已重设</h2>
            <div class="warning">
                ⚠️ <strong>重要：</strong>旧 API Key 已立即失效！新用户 {{ user.username }} 的新 Key 如下，
                只会显示这一次，请立刻复制并安全保存。
            </div>
            <div class="form-group">
                <label>新 API Key</label>
                <div class="key-display">{{ user.api_key }}</div>
            </div>
            <div style="margin-top: 24px;">
                <a href="/admin" class="btn btn-primary">返回仪表盘</a>
            </div>
        </div>
    </div>
</body>
</html>
